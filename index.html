<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIBERRAÍCES — Observa de cerca · sin bloque inferior</title>
<style>
:root {
  --morado:#6F3FA5; --morado-oscuro:#522886; --naranja:#F39C12;
  --texto:#444; --tarjeta:#F5F0FF; --reflexion:#FFF8E8;
}
* { box-sizing:border-box; }
body {
  margin:0; background:#fff; color:var(--texto);
  font-family:Arial,Helvetica,sans-serif; line-height:1.5;
}
.ciberraices { max-width:1180px; margin:24px auto; padding:0 12px; }
.intro {
  background:linear-gradient(135deg,var(--morado),var(--morado-oscuro));
  color:#fff; border-radius:18px; padding:18px 24px; margin-bottom:18px;
  display:flex; align-items:center; justify-content:space-between; gap:20px;
  box-shadow:0 5px 18px rgba(0,0,0,.12);
}
.intro h2 { margin:0; font-size:25px; }
.intro p { margin:4px 0 0; font-size:15px; }
.progreso {
  min-width:140px; text-align:center; background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.35); border-radius:12px; padding:8px 12px;
}
.progreso strong { display:block; font-size:21px; }
.progreso span { font-size:12px; }

.infografia {
  position:relative; width:100%; overflow:hidden; border-radius:18px;
  box-shadow:0 5px 22px rgba(0,0,0,.12); background:#fff;
}
.imagen { display:block; width:100%; height:auto; }

.hotspot {
  position:absolute; z-index:10; border:2px solid rgba(111,63,165,.75);
  background:rgba(255,255,255,.08); border-radius:50%; cursor:pointer;
  transition:.25s ease;
}
.hotspot:hover,.hotspot:focus {
  transform:scale(1.05); background:rgba(111,63,165,.14);
  border-color:var(--naranja); box-shadow:0 0 0 5px rgba(243,156,18,.16);
  outline:none;
}
.hotspot::after {
  content:"+"; position:absolute; right:-8px; top:-10px; width:25px; height:25px;
  border-radius:50%; background:var(--morado); color:#fff; font-size:18px;
  line-height:24px; text-align:center; font-weight:bold;
}
.h1 { width:17%; aspect-ratio:1; left:10%; top:8.59%; }
.h2 { width:17%; aspect-ratio:1; right:10%; top:8.59%; }
.h3 { width:17%; aspect-ratio:1; left:17%; top:65.00%; }
.h4 { width:17%; aspect-ratio:1; right:16%; top:66.23%; }
.hc {
  width:40%; height:42.92%; left:30%; top:39.24%; border-radius:25%;
  border-color:transparent; background:transparent;
}
.hc::after { content:"i"; right:47%; top:46%; background:var(--morado); font-family:Georgia,serif; }

.res {
  position:absolute; z-index:5; pointer-events:none; opacity:0; transition:opacity .35s ease;
}
.r1a,.r1b {
  width:12%; height:17%; top:35%; border:4px solid var(--naranja);
  border-radius:50%; box-shadow:0 0 16px rgba(243,156,18,.55);
}
.r1a { left:32%; } .r1b { right:32%; }
.r2 {
  width:3.5%; height:36%; left:48.25%; top:27%; border:3px solid var(--naranja);
  border-radius:20px; box-shadow:0 0 18px rgba(243,156,18,.65);
}
.r3 {
  width:23%; height:15%; left:38.5%; top:54%; border:4px solid var(--naranja);
  border-radius:50%; box-shadow:0 0 18px rgba(243,156,18,.55);
}
.r4 {
  width:42%; height:36%; left:29%; top:32%; border:3px dashed var(--naranja);
  border-radius:25%; box-shadow:0 0 20px rgba(243,156,18,.35);
}
.infografia.a1 .r1a,.infografia.a1 .r1b,
.infografia.a2 .r2,.infografia.a3 .r3,.infografia.a4 .r4 { opacity:1; }

.panel {
  position:absolute; z-index:30; left:50%; bottom:8%; transform:translate(-50%,20px);
  width:min(540px,78%); background:rgba(255,255,255,.97);
  border-left:6px solid var(--morado); border-radius:14px; padding:18px 20px;
  box-shadow:0 8px 28px rgba(0,0,0,.22); opacity:0; visibility:hidden;
  transition:.3s ease;
}
.panel.visible { opacity:1; visibility:visible; transform:translate(-50%,0); }
.panel h3 { margin:0 30px 7px 0; color:var(--morado-oscuro); font-size:20px; }
.panel p { margin:0; font-size:15px; }
.close {
  position:absolute; top:8px; right:10px; border:0; background:transparent;
  color:#666; font-size:22px; cursor:pointer;
}


@media(max-width:700px){
  .intro { flex-direction:column; align-items:stretch; }
  .progreso { width:auto; }
  .panel { bottom:3%; width:84%; padding:14px 16px; }
  .panel h3 { font-size:17px; } .panel p { font-size:13px; }
}
</style>
</head>

    </div>

<script>
(function(){
  const datos={
    1:["Detalle 1 — Curvas y espirales","Las curvas en espiral se repiten a ambos lados. Son formas orgánicas que aportan movimiento y equilibrio."],
    2:["Detalle 2 — Línea central","La línea vertical central organiza el símbolo y le da dirección. Es una línea recta que estructura el conjunto."],
    3:["Detalle 3 — Curvas inferiores","Las curvas inferiores se conectan con la línea central, generando simetría y estabilidad visual."],
    4:["Detalle 4 — Relación entre formas","Las formas se combinan: líneas rectas y curvas trabajan juntas para crear un diseño armónico y equilibrado."],
    c:["Observa el conjunto","El símbolo combina líneas rectas y curvas. Al observarlo como un todo, puedes identificar cómo cada elemento se relaciona con los demás para organizar visualmente el conjunto."]
  };
  const info=document.getElementById("infografia"), panel=document.getElementById("panel");
  const titulo=document.getElementById("titulo"), texto=document.getElementById("texto");
  const numero=document.getElementById("numero");
  const explorados=new Set();

  document.querySelectorAll(".hotspot").forEach(b=>b.addEventListener("click",()=>{
    const d=b.dataset.d;
    if(["1","2","3","4"].includes(d)){
      explorados.add(d); numero.textContent=explorados.size+"/4";
    }
    info.classList.remove("a1","a2","a3","a4");
    if(["1","2","3","4"].includes(d)) info.classList.add("a"+d);
    titulo.textContent=datos[d][0]; texto.textContent=datos[d][1];
    panel.classList.add("visible");
  }));

  document.getElementById("cerrar").onclick=()=>{
    panel.classList.remove("visible");
    info.classList.remove("a1","a2","a3","a4");
  };
})();
</script>
